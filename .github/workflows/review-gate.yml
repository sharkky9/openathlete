name: Review gate

# Blocks merging while Devin Review still has unresolved findings on a pull
# request, reporting its verdict as the `Devin Review findings` commit status,
# which is a required status check on main.
#
# GitHub Actions has no trigger for a review thread being resolved (the
# pull_request_review_thread webhook is not a workflow event), so on top of the
# pull request and review events the gate re-evaluates open pull requests on a
# schedule. Anything that resolves a thread can skip the wait by re-posting the
# status itself via POST /repos/{repo}/statuses/{sha}.

on:
  # pull_request_target rather than pull_request: a fork-triggered pull_request run
  # gets a read-only token and could not publish the status. No pull request code is
  # checked out or executed here.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Evaluate Devin Review findings
    runs-on: ubuntu-latest
    steps:
      - name: Report unresolved Devin Review findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          owner="${REPO%/*}"
          name="${REPO#*/}"

          if [ -n "${EVENT_PR:-}" ]; then
            prs="$EVENT_PR"
          else
            prs=$(gh pr list --repo "$REPO" --state open --json number --jq '.[].number')
          fi

          for pr in $prs; do
            gh api graphql --paginate \
              -f owner="$owner" -f name="$name" -F number="$pr" \
              -f query='
                query($owner: String!, $name: String!, $number: Int!, $endCursor: String) {
                  repository(owner: $owner, name: $name) {
                    pullRequest(number: $number) {
                      headRefOid
                      reviewThreads(first: 100, after: $endCursor) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          isResolved
                          isOutdated
                          comments(first: 1) { nodes { author { login } } }
                        }
                      }
                    }
                  }
                }' > pages.json

            sha=$(jq -s -r '.[0].data.repository.pullRequest.headRefOid' pages.json)
            open_findings=$(jq -s '[.[].data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false and .isOutdated == false)
              | select(.comments.nodes[0].author.login == "devin-ai-integration")]
              | length' pages.json)

            if [ "$open_findings" -eq 0 ]; then
              state=success
              description="No unresolved Devin Review findings"
            else
              state=failure
              description="$open_findings unresolved Devin Review finding(s)"
            fi

            echo "PR #$pr ($sha): $description"
            gh api "repos/$REPO/statuses/$sha" \
              -f state="$state" \
              -f context='Devin Review findings' \
              -f description="$description" \
              -f target_url="https://github.com/$REPO/pull/$pr" >/dev/null
          done
