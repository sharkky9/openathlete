name: Tests

# Fork-owned workflow (see doc/fork-delta.md). Runs the apps/api Jest suite that
# CONTRIBUTING.md documents (`cd apps/api && pnpm test`) but which had no `test`
# script and therefore never ran. Kept in its own workflow so it does not modify
# upstream's type-check.yml / lint.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-unit:
    name: API unit tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Generate Prisma client
        run: pnpm database run db:generate
        shell: bash

      - name: Build shared library
        run: pnpm shared build
        shell: bash

      - name: Run API tests
        run: pnpm api test
        shell: bash

  api-unit-timezones:
    # GitHub runners are UTC, so the plain `api-unit` job above can only ever
    # exercise one timezone. Day-boundary bugs are invisible there: the training
    # load grid mixed local-time bucketing with UTC day keys for months and no
    # UTC-only suite could have caught it. This job re-runs the same suite
    # across a spread of offsets so that class of defect fails in CI instead of
    # silently misattributing an athlete's training to the wrong day.
    name: API unit tests (timezone sweep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Generate Prisma client
        run: pnpm database run db:generate
        shell: bash

      - name: Build shared library
        run: pnpm shared build
        shell: bash

      - name: Run API tests across timezones
        run: pnpm api test:timezones
        shell: bash

  web-unit:
    name: Web unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Generate Prisma client
        run: pnpm database run db:generate
        shell: bash

      - name: Build shared library
        run: pnpm shared build
        shell: bash

      # No Paraglide compile step here, unlike lint.yml and type-check.yml:
      # apps/web/vitest.config.ts loads paraglideVitePlugin itself, so the
      # runner generates src/paraglide (gitignored) as part of the test run.
      - name: Run web tests
        run: pnpm web test
        shell: bash
