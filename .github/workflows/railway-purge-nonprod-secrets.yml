name: Railway purge non-production secrets

# Fork-owned workflow (see doc/fork-delta.md). Deletes the production
# third-party credentials that were copied into Railway's non-production
# environments when staging was duplicated from production (issue #47).
#
# Manual dispatch only, on purpose: this deletes live credentials from a running
# environment, so it is never triggered by a push, a PR or a schedule. Dry run
# first (the default), read the plan, then dispatch again with dry_run = false.
#
# The `production` environment is protected inside the script itself
# (infra/railway/purge-nonprod-secrets.mjs) and cannot be targeted from here,
# whatever is typed into the `environments` input.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would be deleted without changing anything'
        type: boolean
        required: false
        default: true
      environments:
        description: 'Comma-separated Railway environment names (never production)'
        type: string
        required: false
        default: 'staging'
      project_id:
        description: 'Railway project id. Takes precedence over the RAILWAY_PROJECT_ID repository variable; leave blank to use that variable. Needed whenever the token cannot discover the project by itself.'
        type: string
        required: false
        default: ''

concurrency:
  group: railway-purge-nonprod-secrets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  purge:
    name: Purge non-production credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Deliberately not ./.github/actions/setup: the script is dependency-free
      # and uses global fetch, so it needs Node and nothing else. No pnpm
      # install keeps the blast radius (and the runtime) small.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Verify RAILWAY_TOKEN is present
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "${RAILWAY_TOKEN}" ]; then
            echo "::error::The RAILWAY_TOKEN repository secret is not set (or is empty)."
            echo "Add a Railway account, workspace or project token with access to the"
            echo "OpenAthlete project under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "RAILWAY_TOKEN is present."
        shell: bash

      - name: Purge non-production credentials
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          # Required whenever the script cannot discover the project itself,
          # which is the case for this project: the token authenticates, but
          # Railway's root `projects` query returns an empty list because the
          # project is owned by a workspace (run 31241554634). The dispatch
          # input wins over the repository variable; either one skips discovery.
          RAILWAY_PROJECT_ID_INPUT: ${{ inputs.project_id }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          ENVIRONMENTS: ${{ inputs.environments }}
        run: node infra/railway/purge-nonprod-secrets.mjs
        shell: bash
