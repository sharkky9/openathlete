name: Checks

# Fork-owned workflow (see doc/fork-delta.md). Holds the checks that had no home
# in the upstream lint/type-check/build workflows: Prettier formatting, the
# apps/website Next build, a dependency advisory scan and a secret scan.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      # No Prisma / shared / Paraglide build here on purpose: `pnpm format` is
      # `prettier --check` over each package's checked-in `src`, and the
      # generated Paraglide and Prisma output is gitignored, so generating it
      # would only add files Prettier is not meant to police.
      - name: Check formatting
        run: pnpm format
        shell: bash

  build-website:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      # `pnpm website build` runs the Paraglide compile itself (see the package
      # `build` script), so only the shared library has to be built up front —
      # same shape as the Build Web job in build.yml.
      - name: Build shared library
        run: pnpm shared build
        shell: bash

      - name: Build website
        run: pnpm website build
        shell: bash

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Non-blocking on purpose. The tree already trips this: as of this commit
    # `pnpm audit --audit-level=high --prod` reports 119 high and 8 critical
    # advisories, almost all of them deep transitive dependencies of packages
    # like @getbrevo/brevo and @mastra/core. Making it required today would wedge
    # every pull request on debt none of them introduced. This job exists so the
    # number is visible and so a *new* advisory is noticed; drop
    # continue-on-error (and add the check to the ruleset) once the count is
    # down to something a pull request can be held to.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Audit production dependencies
        run: pnpm audit --audit-level=high --prod
        shell: bash

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # gitleaks scans the commit range, so it needs the history rather than
          # the default single-commit checkout.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
