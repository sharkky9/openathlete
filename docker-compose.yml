version: '3.8'

services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: openathlete-postgres
    environment:
      POSTGRES_USER: openathlete
      POSTGRES_PASSWORD: openathlete_dev_password
      POSTGRES_DB: openathlete
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openathlete"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - openathlete-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: openathlete-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - openathlete-network

  # API Service
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.local
    container_name: openathlete-api
    ports:
      - "3000:3000"
    environment:
      # Core configuration
      ENV: ${ENV:-development}
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      
      # Database
      DATABASE_URL: postgresql://openathlete:openathlete_dev_password@postgres:5432/openathlete
      
      # Redis - use Docker service name for internal communication
      REDIS_URL: redis://redis:6379/0
      
      # Security
      HASH_PEPPER: ${HASH_PEPPER:-dev-pepper-change-in-production-min-32-chars}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-secret-key-change-in-production-min-32-chars-long}
      
      # Application URLs
      APP_URL: ${APP_URL:-http://localhost:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      
      # Email service (Brevo, optional - emails are skipped when unset)
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL}
      
      # Firebase (optional)
      FIREBASE_FUNCTIONS_URL: ${FIREBASE_FUNCTIONS_URL:-}
      
      # Feature flags
      ENABLE_ACTIVITY_IMPORT: ${ENABLE_ACTIVITY_IMPORT:-false}
      ENABLE_ACTIVITY_PROCESSING: ${ENABLE_ACTIVITY_PROCESSING:-false}
      
      # Monitoring (optional)
      BETTER_STACK_DSN: ${BETTER_STACK_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - openathlete-network
    restart: unless-stopped

  # Web Frontend
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Point to API on port 3000 (accessible from browser)
        VITE_API_BASE_URL: "http://localhost:3000"
        # Baked into the bundle at build time; empty disables browser error
        # reporting. Only set it to a DSN you own.
        VITE_BETTER_STACK_DSN: ${VITE_BETTER_STACK_DSN:-}
    container_name: openathlete-web
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - openathlete-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  openathlete-network:
    driver: bridge
